<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#C9B8FF"/>
      <stop offset="60%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="300" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="150" cy="150" r="100" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <text x="150" y="168" font-size="130" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">🐱</text>
  <text x="48" y="58" font-size="26" opacity="0.9">✨</text>
  <text x="232" y="52" font-size="22" opacity="0.8">⭐</text>
  <text x="38" y="255" font-size="20" opacity="0.7">💫</text>
  <text x="242" y="262" font-size="24" opacity="0.9">✨</text>
  <rect width="300" height="300" rx="24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
</svg>
